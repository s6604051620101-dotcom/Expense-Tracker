<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรายรับรายจ่าย - Minimal Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .bg-minimal { background-color: #F9F8F6; }
    </style>
</head>
<body class="bg-minimal text-zinc-800 min-h-screen py-10 px-4 md:py-16">

    <div class="max-w-xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-white border border-zinc-200/80 p-8 rounded-3xl shadow-xs text-center">
            <h1 class="text-2xl md:text-3xl font-semibold tracking-tight text-zinc-900">บันทึกรายรับรายจ่าย</h1>
            <p class="text-zinc-400 text-sm mt-1">Minimal Expense Tracker</p>
        </div>

        <!-- Dashboard สรุปยอด -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-xs">
                <p class="text-xs text-zinc-400 font-medium mb-1">ยอดคงเหลือ</p>
                <p id="balance" class="text-xl md:text-2xl font-semibold text-zinc-900 tracking-tight break-words">฿0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-xs">
                <p class="text-xs text-emerald-600 font-medium mb-1">รายรับ</p>
                <p id="total-income" class="text-xl md:text-2xl font-semibold text-emerald-700 tracking-tight break-words">฿0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-xs">
                <p class="text-xs text-rose-500 font-medium mb-1">รายจ่าย</p>
                <p id="total-expense" class="text-xl md:text-2xl font-semibold text-rose-600 tracking-tight break-words">฿0</p>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6 items-start">
            <!-- ฟอร์มเพิ่มรายการ -->
            <form id="transaction-form" class="space-y-5 bg-white p-7 rounded-3xl border border-zinc-200/80 shadow-xs">
                <h2 class="font-medium text-zinc-900 text-base border-b border-zinc-100 pb-3">เพิ่มรายการใหม่</h2>
                
                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2">ประเภทรายการ</label>
                    <select id="type" class="w-full p-3.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-zinc-400 transition">
                        <option value="income">รายรับ</option>
                        <option value="expense">รายจ่าย</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2">หมวดหมู่</label>
                    <select id="category" class="w-full p-3.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-zinc-400 transition">
                        <option value="อาหาร">🍜 อาหาร</option>
                        <option value="เดินทาง">🚗 เดินทาง</option>
                        <option value="บันเทิง">🎉 บันเทิง</option>
                        <option value="บิล/ค่าน้ำไฟ">💡 บิล / สาธารณูปโภค</option>
                        <option value="เงินเดือน">💰 เงินเดือน</option>
                        <option value="อื่นๆ">📌 อื่นๆ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2">ชื่อรายการ / โน้ตเพิ่มเติม</label>
                    <input type="text" id="text" placeholder="เช่น ค่ากาแฟ, เงินเดือนออก" required
                        class="w-full p-3.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-zinc-40
