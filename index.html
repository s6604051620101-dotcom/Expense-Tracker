<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บแอปพลิเคชันบันทึกรายรับรายจ่าย</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js สำหรับทำกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mb-10">
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">บันทึกรายรับรายจ่าย</h1>
            <p class="text-indigo-200 text-sm mt-1">โปรเจกต์สำหรับส่งอาจารย์</p>
        </div>

        <div class="p-6 space-y-6">
            <!-- 1. หน้า Dashboard สรุปยอด -->
            <div class="grid grid-cols-3 gap-3 text-center">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <p class="text-xs text-slate-500">คงเหลือ</p>
                    <p id="balance" class="text-lg font-bold text-slate-800">฿0</p>
                </div>
                <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                    <p class="text-xs text-emerald-600">รายรับ</p>
                    <p id="total-income" class="text-lg font-bold text-emerald-600">฿0</p>
                </div>
                <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
                    <p class="text-xs text-rose-600">รายจ่าย</p>
                    <p id="total-expense" class="text-lg font-bold text-rose-600">฿0</p>
                </div>
            </div>

            <!-- 2. ฟอร์มบันทึกรายการ (เลือกประเภท, หมวดหมู่, จำนวนเงิน, โน้ต) -->
            <form id="transaction-form" class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <h2 class="font-semibold text-slate-700 text-sm">เพิ่มรายการใหม่</h2>
                
                <div>
                    <label class="block text-xs text-slate-600 mb-1">ประเภทรายการ</label>
                    <select id="type" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="income">รายรับ</option>
                        <option value="expense">รายจ่าย</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-600 mb-1">หมวดหมู่</label>
                    <select id="category" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="อาหาร">🍜 อาหาร</option>
                        <option value="เดินทาง">🚗 เดินทาง</option>
                        <option value="บันเทิง">🎉 บันเทิง</option>
                        <option value="บิล/ค่าน้ำไฟ">💡 บิล / สาธารณูปโภค</option>
                        <option value="เงินเดือน">💰 เงินเดือน</option>
                        <option value="อื่นๆ">📌 อื่นๆ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-600 mb-1">ชื่อรายการ / โน้ตเพิ่มเติม</label>
                    <input type="text" id="text" placeholder="เช่น ข้าวมันไก่, ค่ารถไฟฟ้า" required
                        class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-600 mb-1">จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" placeholder="0.00" step="any" required
                        class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2.5 rounded-lg text-sm transition duration-200 cursor-pointer">
                    บันทึกรายการ
                </button>
            </form>

            <!-- 4. กราฟสรุปสัดส่วนรายจ่าย -->
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <h2 class="font-semibold text-slate-700 text-sm mb-3 text-center">สัดส่วนรายจ่ายตามหมวดหมู่</h2>
                <div class="w-full flex justify-center">
                    <div class="w-64 h-64">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 3. ตารางประวัติรายการ (พร้อมปุ่มลบ) -->
            <div>
                <h2 class="font-semibold text-slate-700 text-sm mb-3">ประวัติรายการ</h2>
                <ul id="list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- รายการจะถูกเพิ่มอัตโนมัติ -->
                </ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
